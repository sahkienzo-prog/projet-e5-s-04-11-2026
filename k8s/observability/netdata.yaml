apiVersion: v1
kind: Namespace
metadata:
  name: observability-s-04-11-2026
  labels:
    nom: sahki
    empreinte: s-04-11-2026
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netdata-s-04-11-2026
  namespace: observability-s-04-11-2026
  labels:
    nom: sahki
    empreinte: s-04-11-2026
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netdata-s-04-11-2026
  template:
    metadata:
      labels:
        app: netdata-s-04-11-2026
        nom: sahki
        empreinte: s-04-11-2026
    spec:
      hostPID: true
      containers:
      - name: netdata-s-04-11-2026
        image: netdata/netdata:v2.6.3
        ports:
        - containerPort: 19999
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 768Mi
        securityContext:
          capabilities:
            add:
            - SYS_PTRACE
            - SYS_ADMIN
        volumeMounts:
        - name: proc-s-04-11-2026
          mountPath: /host/proc
          readOnly: true
        - name: sys-s-04-11-2026
          mountPath: /host/sys
          readOnly: true
        - name: cgroups-s-04-11-2026
          mountPath: /sys/fs/cgroup
          readOnly: true
      volumes:
      - name: proc-s-04-11-2026
        hostPath:
          path: /proc
      - name: sys-s-04-11-2026
        hostPath:
          path: /sys
      - name: cgroups-s-04-11-2026
        hostPath:
          path: /sys/fs/cgroup
---
apiVersion: v1
kind: Service
metadata:
  name: netdata-s-04-11-2026
  namespace: observability-s-04-11-2026
  labels:
    nom: sahki
    empreinte: s-04-11-2026
spec:
  selector:
    app: netdata-s-04-11-2026
  ports:
  - name: http-s-04-11-2026
    port: 19999
    targetPort: 19999
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netdata-s-04-11-2026
  namespace: observability-s-04-11-2026
  labels:
    nom: sahki
    empreinte: s-04-11-2026
spec:
  ingressClassName: traefik
  rules:
  - host: netdata-s-04-11-2026.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: netdata-s-04-11-2026
            port:
              number: 19999

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolation-s-04-11-2026
  namespace: preprod-s-04-11-2026
  labels:
    nom: sahki
    empreinte: s-04-11-2026
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 4242
    - port: 9898
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-s-04-11-2026
  namespace: preprod-s-04-11-2026
  labels:
    nom: sahki
    empreinte: s-04-11-2026
spec:
  hard:
    pods: "70"
    requests.cpu: "4"
    requests.memory: 5Gi

---
apiVersion: v1
kind: LimitRange
metadata:
  name: limites-s-04-11-2026
  namespace: preprod-s-04-11-2026
  labels:
    nom: sahki
    empreinte: s-04-11-2026
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 25m
      memory: 16Mi
    default:
      cpu: "1"
      memory: 256Mi

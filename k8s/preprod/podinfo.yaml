apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-s-04-11-2026
  namespace: preprod-s-04-11-2026
  labels:
    nom: sahki
    empreinte: s-04-11-2026
spec:
  replicas: 3
  selector:
    matchLabels:
      app: podinfo-s-04-11-2026
  template:
    metadata:
      labels:
        app: podinfo-s-04-11-2026
        nom: sahki
        empreinte: s-04-11-2026
    spec:
      containers:
      - name: podinfo-s-04-11-2026
        image: podinfo-s-04-11-2026:1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9898
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 9898
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 9898
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-s-04-11-2026
  namespace: preprod-s-04-11-2026
  labels:
    nom: sahki
    empreinte: s-04-11-2026
spec:
  type: ClusterIP
  selector:
    app: podinfo-s-04-11-2026
  ports:
  - name: http-s-04-11-2026
    port: 9898
    targetPort: 9898
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: podinfo-s-04-11-2026
  namespace: preprod-s-04-11-2026
  labels:
    nom: sahki
    empreinte: s-04-11-2026
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: podinfo-s-04-11-2026
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
